<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1017"><meta name="apple-mobile-web-app-capable" content="yes"><title>Lift Journal</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--bg:#0c1017;--panel:#171e29;--muted:#9ca8b9;--line:#2b3443;--accent:#a6f16a;--text:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:650px;margin:auto;padding:22px 18px 95px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--accent)}h1{font-size:30px;letter-spacing:-.04em;margin:7px 0}h2{font-size:19px;margin:0 0 12px}.sub,.hint{color:var(--muted);font-size:14px}.pill{border:1px solid #354255;border-radius:50px;padding:9px 12px;color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}.hero{background:linear-gradient(130deg,#253828,#171e29 68%)}.eyebrow{font-size:12px;color:var(--accent);font-weight:750;text-transform:uppercase;letter-spacing:.1em}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1;background:#1c2531;color:#aab4c2;border:1px solid #344052;padding:12px;border-radius:12px;font-weight:750}.tabs button.active{background:var(--accent);color:#12200a;border-color:var(--accent)}button{cursor:pointer;font:inherit}button.primary{border:0;background:var(--accent);color:#13220b;font-weight:800;border-radius:13px;padding:14px 18px;width:100%}button.secondary{border:1px solid #405067;background:#263141;color:#f5f7fb;border-radius:12px;padding:11px 14px}button.small{padding:8px 12px;font-size:13px}button:disabled{opacity:.45}input,select{font:inherit;background:#101720;color:#fff;border:1px solid #3a4658;border-radius:11px;padding:12px;min-width:0}input[type=number]{width:80px;text-align:center}input[type=date]{width:100%}.exercise{display:flex;justify-content:space-between;gap:12px;align-items:center}.exercise h3{margin:0 0 6px;font-size:17px}.exercise .sub{font-size:13px}.setrow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}.setrow label{font-size:13px;color:var(--muted);width:50px}.setrow input{flex:1;width:0}.setrow button{border:1px solid #405067;background:#263141;color:#fff;border-radius:11px;padding:12px}.setrow button.done{background:var(--accent);color:#17230d;border-color:var(--accent)}.mini{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#101720;border-radius:13px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#101720ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}nav button{width:min(25%,150px);border:0;background:transparent;color:var(--muted);font-size:12px;padding:7px 0}nav button.active{color:var(--accent);font-weight:800}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:10px}.notice{background:#253221;color:#d6f3c3;padding:12px;border-radius:12px;font-size:13px}canvas{width:100%;height:180px}.muted{color:var(--muted)}.space{height:8px}@media(min-width:700px){main{padding-top:40px}}
:root{--accent:#72eb87;--purple:#a58aff} .brand{color:var(--purple)} .tabs button.active{background:var(--purple);color:#151020}.eyebrow{color:var(--purple)}
.demo{display:grid;grid-template-columns:125px 1fr;gap:12px;align-items:center;background:#101722;border:1px solid #343e50;border-radius:15px;padding:10px;margin:13px 0}.figure{height:112px;position:relative;display:flex;align-items:center;justify-content:center}.figure svg{width:122px;height:105px}.figure .moving{transform-origin:60px 44px;animation:lift 2.7s ease-in-out infinite alternate}.figure.paused .moving{animation-play-state:paused}.figure .sweat{opacity:.65;animation:sweat 2.7s infinite alternate}.figure.paused .sweat{animation-play-state:paused}@keyframes lift{0%,10%{transform:translateY(13px)}85%,100%{transform:translateY(-6px)}}@keyframes sweat{from{opacity:0}to{opacity:.9}}.demo-info{font-size:12px;color:#b7c4d6;line-height:1.45}.demo-info strong{display:block;color:#e5e8f1;font-size:13px;margin-bottom:5px}.demo-info .muscle{color:#b9a5ff}.demo-toggle{border:1px solid #40495b;border-radius:9px;background:#222c3c;color:#e4dafa;padding:7px 9px;margin-top:8px;font-size:12px}.workout-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.workout-top h2{margin:0}.progress-track{height:7px;background:#30394a;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress-fill{height:100%;background:#70e98b;transition:width .2s}.control-line{display:flex;align-items:center;gap:10px;margin:13px 0}.control-line input{flex:1;width:100%;font-size:24px;font-weight:800;padding:9px}.stepper{background:#2a3445;color:#fff;border:1px solid #465167;border-radius:12px;min-width:48px;min-height:48px;font-size:23px}.rep-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rep-unit{text-align:center;background:#111925;border:1px solid #354054;border-radius:13px;padding:9px 3px}.rep-unit span{font-size:12px;color:#aab5c7}.rep-unit .control-line{gap:3px;margin:7px 0 0}.rep-unit .stepper{min-width:27px;min-height:37px;padding:0;font-size:18px}.rep-unit input{min-width:0;font-size:19px;padding:7px 1px}.suggest{background:#1a342a;border:1px solid #438e61;border-radius:13px;padding:12px;margin:15px 0;font-size:13px}.suggest b{display:block;font-size:20px;color:#8ef5aa}.small-link{background:none;border:0;color:#b9a5ff;padding:10px;font-size:13px}.done-list{display:grid;gap:8px;margin:15px 0}.done-list button{border:1px solid #364256;border-radius:11px;background:#202a39;color:#f1f4f8;text-align:left;padding:11px}.end-summary{text-align:center;padding:25px 10px}.end-summary .trophy{font-size:48px}.hintline{font-size:12px;color:#a8b5c7}.finish-options{display:grid;gap:10px}
</style></head><body><main><header><div class="brand">LIFT JOURNAL</div><div class="pill" id="yearPill">YEAR 1</div></header><section id="home"></section><section id="workout" class="hidden"></section><section id="progress" class="hidden"></section><section id="settings" class="hidden"></section></main><nav><button data-view="home" class="active">⌂<br>Home</button><button data-view="workout">▣<br>Workout</button><button data-view="progress">↗<br>Progress</button><button data-view="settings">⚙<br>Settings</button></nav><script>
const PLAN=[{name:'Full Body A',ex:[['Squat / Leg Press',3,8,12,2.5],['Bench Press',3,8,12,2.5],['Lat Pulldown',3,8,12,2.5],['Romanian Deadlift',3,8,12,2.5],['Lateral Raise',3,10,15,1],['Plank (seconds)',3,30,45,5]]},{name:'Full Body B',ex:[['Deadlift / Trap Bar',3,5,8,5],['Overhead Press',3,8,12,2.5],['Seated Cable Row',3,8,12,2.5],['Bulgarian Split Squat',3,8,12,2.5],['Biceps Curl',3,10,15,1],['Triceps Pushdown',3,10,15,2.5]]},{name:'Full Body C',ex:[['Goblet / Hack Squat',3,8,12,2.5],['Incline Dumbbell Press',3,8,12,2.5],['Pulldown / Assisted Pull-up',3,8,12,2.5],['Hip Thrust',3,8,12,2.5],['Leg Curl',3,10,15,2.5],['Cable Crunch',3,10,15,2.5]]}];
const KEY='lift-journal-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{sessions:[],checkins:[],draft:null}}catch{data={sessions:[],checkins:[],draft:null}};data.sessions||=[];data.checkins||=[];let view='home';let currentExercise=0;let workoutDone=false;let demoPaused=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(KEY,JSON.stringify(data))}function sessions(){return [...data.sessions].sort((a,b)=>a.date.localeCompare(b.date))}function week(){return Math.floor(data.sessions.length/3)+1}function lastFor(day,ex){return [...data.sessions].reverse().find(s=>s.day===day)?.exercises?.[ex]}function target(day,idx){const prior=lastFor(day,idx);if(!prior)return '';let w=Number(prior.weight);if(!Number.isFinite(w))return '';const e=PLAN[day].ex[idx];const pass=prior.reps.every(r=>Number(r)>=e[3]);return +(w+(pass?e[4]:0)).toFixed(2)}function show(v){view=v;for(const n of ['home','workout','progress','settings'])$(n).classList.toggle('hidden',n!==v);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}function start(day){if(data.draft&&!confirm('Replace your unfinished workout?'))return;data.draft={day,date:today(),exercises:PLAN[day].ex.map((e,i)=>({weight:target(day,i),reps:['','','']})),cardio:''};currentExercise=0;workoutDone=false;save();show('workout')}function render(){const total=data.sessions.length;const w=week();$('yearPill').textContent=`YEAR ${Math.ceil(w/52)} · WEEK ${((w-1)%52)+1}`;$('home').innerHTML=`<div class="eyebrow">Your training</div><h1>Keep showing up.</h1><p class="sub">3 workouts a week. One set at a time.</p><div class="card hero"><div class="eyebrow">Next session</div><h2 style="margin-top:10px">${PLAN[total%3].name}</h2><p class="sub">6 exercises · ~45–60 min · optional 15 min cardio</p><button class="primary" id="startNext">${data.draft?'Resume workout':'Start workout →'}</button></div><div class="grid"><div class="stat"><b>${total}</b><span>Workouts logged</span></div><div class="stat"><b>${Math.floor(total/3)}</b><span>3-session blocks</span></div><div class="stat"><b>${data.checkins.length}</b><span>Check-ins</span></div></div><h2 style="margin-top:25px">Your routine</h2>${PLAN.map((p,i)=>`<div class="card row"><div><b>${p.name}</b><div class="sub">${p.ex.length} exercises</div></div><button class="secondary small" data-start="${i}">Start</button></div>`).join('')}`;$('startNext').onclick=()=>data.draft?show('workout'):start(total%3);document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(+b.dataset.start));renderWorkout();renderProgress();renderSettings()}
function figureSvg(name){const squat=/Squat|Split/.test(name),hinge=/Deadlift|Romanian|Hip Thrust/.test(name),pull=/Pulldown|Pull-up|Row|Curl/.test(name),plank=/Plank|Crunch/.test(name);const movement=squat?'Squat':hinge?'Hinge':pull?'Pull':plank?'Core':'Press';return `<svg viewBox="0 0 120 110" role="img" aria-label="Animated stick figure demonstrating ${esc(movement.toLowerCase())} movement"><path d="M8 96H113" stroke="#465269" stroke-width="3" stroke-linecap="round"/><g stroke="#e8ecff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="26" r="12" fill="#f2e8ff" stroke="#c3aaff"/><path d="M60 38V67M60 67L44 91M60 67L77 91"/><path d="M60 44L42 59M60 44L79 59"/></g><path d="M55 24q2 -3 5 0" stroke="#29314a" stroke-width="2" fill="none"/><circle cx="55" cy="23" r="1.5" fill="#29314a"/><circle cx="64" cy="23" r="1.5" fill="#29314a"/><g class="moving" stroke="#b39aff" stroke-width="4" stroke-linecap="round" fill="none">${plank?'<path d="M32 69H89"/>':pull?'<path d="M34 54H86M34 50V60M86 50V60"/>':'<path d="M34 57H87M35 51V63M86 51V63"/>'}</g><path class="sweat" d="M78 18q7 8 0 12" stroke="#73dce9" stroke-width="3" fill="none"/></svg>`}
function demoMeta(name){if(/Squat|Leg Press|Split/.test(name))return ['Quads · Glutes','Keep knees tracking over toes; move with control.'];if(/Bench|Incline|Pushdown/.test(name))return ['Chest · Triceps','Brace your body and use a smooth, controlled range.'];if(/Pulldown|Pull-up|Row/.test(name))return ['Back · Biceps','Lead with elbows; avoid swinging.'];if(/Deadlift|Romanian|Hip Thrust/.test(name))return ['Glutes · Hamstrings','Brace your core; keep the movement controlled.'];if(/Lateral|Overhead/.test(name))return ['Shoulders','Keep your shoulders comfortable; avoid momentum.'];if(/Curl/.test(name))return ['Biceps','Keep elbows steady and control the lowering phase.'];return ['Core','Brace gently and breathe throughout each rep.']}
function renderWorkout(){const d=data.draft;if(!d){$('workout').innerHTML=`<h1>Workout</h1><p class="sub">Pick a workout to begin.</p>${PLAN.map((p,i)=>`<div class="card row"><b>${p.name}</b><button class="secondary" data-pick="${i}">Start →</button></div>`).join('')}`;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>start(+b.dataset.pick));return}const p=PLAN[d.day],n=p.ex.length;d.completed??=[];const done=d.completed.filter(Boolean).length;if(workoutDone){$('workout').innerHTML=`<div class="card end-summary"><div class="trophy">🏆</div><h1>Workout complete!</h1><p class="sub">${done} of ${n} exercises logged · ${esc(p.name)}</p><div class="done-list">${p.ex.map((e,i)=>`<button data-edit="${i}">${d.completed[i]?'✓':'○'} ${esc(e[0])} · ${esc(d.exercises[i].weight||'—')} kg</button>`).join('')}</div><label class="sub">Cardio minutes (optional)</label><input id="cardio" type="number" min="0" inputmode="numeric" value="${esc(d.cardio)}" placeholder="15" style="width:100%;margin:9px 0 16px"><button class="primary" id="finish">Finish & save workout ✓</button><button class="small-link" id="backToWorkout">Back to workout</button></div>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{currentExercise=+b.dataset.edit;workoutDone=false;renderWorkout()});$('backToWorkout').onclick=()=>{workoutDone=false;renderWorkout()};$('cardio').oninput=e=>{d.cardio=e.target.value;save()};$('finish').onclick=()=>{if(!done){alert('Log at least one exercise before finishing.');return}if(done<n&&!confirm(`Only ${done} of ${n} exercises are logged. Finish anyway?`))return;data.sessions.push(JSON.parse(JSON.stringify(d)));data.draft=null;workoutDone=false;currentExercise=0;save();show('home');alert('Workout saved. Nice work!')};return}
const i=Math.min(currentExercise,n-1);currentExercise=i;const e=p.ex[i],x=d.exercises[i],name=e[0],meta=demoMeta(name),unit=name.includes('seconds')?'seconds':'reps';const allTop=x.reps.every(r=>r!==''&&Number(r)>=e[3]);const next=Number(x.weight||0)+(allTop?e[4]:0);$('workout').innerHTML=`<div class="eyebrow">Live session · ${esc(p.name)}</div><div class="workout-top"><h1 style="margin:7px 0">Exercise ${i+1} of ${n}</h1><span class="pill">${done}/${n} logged</span></div><div class="progress-track"><div class="progress-fill" style="width:${done/n*100}%"></div></div><div class="card"><div class="row"><button class="secondary small" id="prevEx" ${i===0?'disabled':''} aria-label="Previous exercise">←</button><div style="text-align:center"><h2>${esc(name)}</h2><div class="sub">${e[1]} sets · ${e[2]}–${e[3]} ${unit}</div></div><button class="secondary small" id="nextEx" ${i===n-1?'disabled':''} aria-label="Next exercise">→</button></div><div class="demo"><div class="figure ${demoPaused?'paused':''}">${figureSvg(name)}</div><div class="demo-info"><strong>Mini movement guide</strong><span class="muscle">${meta[0]}</span><br>${meta[1]}<br><button class="demo-toggle" id="toggleDemo">${demoPaused?'▶ Play':'Ⅱ Pause'} animation</button></div></div><p class="hintline">Cartoon cue only — not a detailed technique tutorial.</p><label class="sub">${name.includes('seconds')?'Hold time target':'Weight (kg)'}</label><div class="control-line"><button class="stepper" id="weightMinus" aria-label="Decrease weight">−</button><input type="number" min="0" step="0.5" inputmode="decimal" id="weightValue" value="${esc(x.weight)}" placeholder="0"><button class="stepper" id="weightPlus" aria-label="Increase weight">+</button></div><div class="sub">${unit==='seconds'?'Hold duration for each set':'Repetitions completed'}</div><div class="rep-grid">${x.reps.map((r,j)=>`<div class="rep-unit"><span>Set ${j+1}</span><div class="control-line"><button class="stepper" data-minus="${j}" aria-label="Set ${j+1} minus">−</button><input type="number" min="0" inputmode="numeric" data-rep="${j}" value="${esc(r)}" placeholder="0" aria-label="Set ${j+1} reps"><button class="stepper" data-plus="${j}" aria-label="Set ${j+1} plus">+</button></div></div>`).join('')}</div><div class="suggest"><span>Suggested next ${unit==='seconds'?'hold target':'weight'}</span><b id="nextWeight">${Number.isFinite(next)?next.toFixed(1):'—'} ${unit==='seconds'?'sec':'kg'}</b><span id="nextNote">${allTop?'You reached the top of the range on every set.':'Hit the upper rep goal on every set to progress.'}</span></div><button class="primary" id="saveNext">${i===n-1?'Save & review ✓':'Save & Next →'}</button><button class="small-link" id="review">Review completed exercises (${done})</button></div><button class="small-link" id="discard">Discard unfinished workout</button>`;
function updateSuggestion(){const ready=x.reps.every(r=>r!==''&&Number(r)>=e[3]),v=Number(x.weight||0)+(ready?e[4]:0);$('nextWeight').textContent=v.toFixed(1)+(unit==='seconds'?' sec':' kg');$('nextNote').textContent=ready?'You reached the top of the range on every set.':'Hit the upper rep goal on every set to progress.'}
$('prevEx').onclick=()=>{currentExercise--;renderWorkout()};$('nextEx').onclick=()=>{currentExercise++;renderWorkout()};$('toggleDemo').onclick=()=>{demoPaused=!demoPaused;renderWorkout()};$('weightMinus').onclick=()=>{x.weight=String(Math.max(0,(Number(x.weight)||0)-e[4]));save();$('weightValue').value=x.weight;updateSuggestion()};$('weightPlus').onclick=()=>{x.weight=String((Number(x.weight)||0)+e[4]);save();$('weightValue').value=x.weight;updateSuggestion()};$('weightValue').oninput=ev=>{x.weight=ev.target.value;save();updateSuggestion()};document.querySelectorAll('[data-rep]').forEach(el=>el.oninput=ev=>{x.reps[+el.dataset.rep]=ev.target.value;save();updateSuggestion()});document.querySelectorAll('[data-plus]').forEach(el=>el.onclick=()=>{const j=+el.dataset.plus;x.reps[j]=String((Number(x.reps[j])||0)+1);save();renderWorkout()});document.querySelectorAll('[data-minus]').forEach(el=>el.onclick=()=>{const j=+el.dataset.minus;x.reps[j]=String(Math.max(0,(Number(x.reps[j])||0)-1));save();renderWorkout()});$('saveNext').onclick=()=>{if(x.weight===''||x.reps.some(r=>r==='')){alert('Enter your weight and all three sets before saving.');return}d.completed[i]=true;save();if(i===n-1||d.completed.filter(Boolean).length===n){workoutDone=true}else{currentExercise=i+1}renderWorkout()};$('review').onclick=()=>{workoutDone=true;renderWorkout()};$('discard').onclick=()=>{if(confirm('Discard unfinished workout?')){data.draft=null;save();show('home')}}}
function renderProgress(){const latest=data.checkins.at(-1);$('progress').innerHTML=`<h1>Your progress</h1><p class="sub">Small steps add up.</p><div class="card"><h2>Weekly check-in</h2><div class="stack"><label class="sub">Date<input type="date" id="checkDate" value="${today()}"></label><label class="sub">Average body weight (kg)<input id="bodyWeight" type="number" step="0.1" placeholder="e.g. 78.5" style="width:100%"></label><label class="sub">Waist (cm)<input id="waist" type="number" step="0.1" placeholder="Optional" style="width:100%"></label><label class="sub">Notes<input id="note" placeholder="How did you feel?" style="width:100%"></label><button class="primary" id="saveCheck">Save check-in</button></div></div><div class="card"><h2>Weight trend</h2><canvas id="chart" width="600" height="240"></canvas><div class="mini">${latest?`Latest: ${esc(latest.weight)} kg on ${esc(latest.date)}`:'Add two check-ins to see your trend.'}</div></div><h2>Recent workouts</h2>${[...data.sessions].reverse().slice(0,12).map(s=>`<div class="card row"><div><b>${PLAN[s.day].name}</b><div class="sub">${esc(s.date)} · ${s.exercises.length} exercises</div></div><span class="pill">✓</span></div>`).join('')||'<p class="sub">Your saved sessions will appear here.</p>'}`;$('saveCheck').onclick=()=>{const weight=+$('bodyWeight').value;if(!(weight>0)){alert('Enter your average body weight.');return}data.checkins.push({date:$('checkDate').value,weight,waist:$('waist').value,note:$('note').value});data.checkins.sort((a,b)=>a.date.localeCompare(b.date));save();renderProgress()};drawChart()}
function drawChart(){const c=$('chart'),ctx=c.getContext('2d'),a=data.checkins.filter(x=>x.weight>0);ctx.clearRect(0,0,600,240);ctx.strokeStyle='#354252';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,210);ctx.lineTo(570,210);ctx.stroke();if(a.length<2)return;const weights=a.map(x=>x.weight),min=Math.min(...weights)-1,max=Math.max(...weights)+1;ctx.strokeStyle='#a6f16a';ctx.lineWidth=4;ctx.beginPath();a.forEach((x,i)=>{let px=30+i*540/(a.length-1),py=205-(x.weight-min)/(max-min)*175;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()}
function renderSettings(){$('settings').innerHTML=`<h1>Settings & backup</h1><p class="sub">Your data is saved on this device. Back it up regularly.</p><div class="card stack"><h2>Protect your progress</h2><button class="primary" id="export">Export backup (.json)</button><label class="secondary" style="text-align:center;cursor:pointer">Import backup<input id="import" type="file" accept="application/json,.json" style="display:none"></label><p class="mini">Import replaces your existing data. Store exported backups in Files or iCloud Drive.</p></div><div class="card"><h2>Install on iPhone</h2><p class="sub">When hosted over HTTPS, open this app in Safari, tap Share → Add to Home Screen. Offline support is enabled after the first successful load.</p></div><div class="card"><h2>About your plan</h2><p class="sub">Full-body A/B/C, 3 days per week. Target load increases when all three sets reach the upper rep goal. Continue beyond 52 weeks automatically.</p></div>`;$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='lift-journal-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.sessions)||!Array.isArray(d.checkins))throw Error('Invalid backup');if(!confirm('Replace your current workouts with this backup?'))return;data={sessions:d.sessions,checkins:d.checkins,draft:d.draft||null};save();show('home');alert('Backup restored')}catch(err){alert('Could not import: '+err.message)}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
